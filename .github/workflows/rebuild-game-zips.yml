name: Rebuild downloadable game packages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prune maps and verify retained geometry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const builds = ['Cappe-in-MiamiWeb', 'Cappe-in-MiamiRustWasm'];
          const marker = '})([';
          const note = '// Árvore de progressão:';
          const results = [];
          function load(source) {
            const ctx = {};
            vm.runInNewContext(source + ';globalThis.__maps=MAPS.map(m=>({name:m.name,w:m.w,h:m.h,tiles:m.tiles.map(t=>t.slice()),objects:m.objects.map(o=>o.slice())}));globalThis.__tree=LEVEL_TREE;', ctx, {timeout:10000});
            return ctx;
          }
          function allowlist(html) {
            const start=html.indexOf('const NEON_ALLOWED_MAP_NAMES');
            const open=html.indexOf('[',start), end=html.indexOf(']);',open);
            if(start<0||open<0||end<0) throw Error('NEON allowlist missing');
            return vm.runInNewContext(html.slice(open,end+1));
          }
          for(const build of builds) {
            const file=build+'/js/maps.js';
            const source=fs.readFileSync(file,'utf8');
            const html=fs.readFileSync(build+'/index.html','utf8');
            const original=load(source), allowed=allowlist(html), keep=new Set(allowed);
            if(allowed.length!==61||keep.size!==61) throw Error(build+': expected 61 unique maps');
            const mapByName=new Map(original.__maps.map(m=>[m.name,m]));
            if(mapByName.size!==original.__maps.length) throw Error(build+': duplicate map names');
            for(const name of allowed) if(!mapByName.has(name)) throw Error(build+': missing allowed map '+name);
            const maps=original.__maps.filter(m=>keep.has(m.name));
            const dict=[], ids=new Map();
            const intern=value=>{
              if(typeof value!=='string') throw Error(build+': invalid map identifier');
              if(!ids.has(value)){ids.set(value,dict.length);dict.push(value);}
              return ids.get(value);
            };
            const encoded=maps.map(m=>({
              name:m.name,w:m.w,h:m.h,
              t:m.tiles.flatMap(t=>{if(t.length!==7)throw Error('invalid tile in '+m.name);return [intern(t[0]),...t.slice(1)];}),
              o:m.objects.flatMap(o=>{if(o.length!==6)throw Error('invalid object in '+m.name);return [intern(o[0]),o[1],o[2],intern(o[3]),o[4],o[5]];})
            }));
            const call=source.indexOf(marker), tail=source.indexOf(note);
            if(call<0||tail<0) throw Error(build+': unexpected maps.js format');
            const next=source.slice(0,call+3)+JSON.stringify(dict)+','+JSON.stringify(encoded)+');'+String.fromCharCode(10,10)+source.slice(tail);
            const verified=load(next);
            if(JSON.stringify(verified.__maps)!==JSON.stringify(maps)) throw Error(build+': retained map geometry changed');
            if(JSON.stringify(verified.__tree)!==JSON.stringify(original.__tree)) throw Error(build+': campaign tree changed');
            fs.writeFileSync(file,next,'utf8');
            results.push({build,old:Buffer.byteLength(source),next:Buffer.byteLength(next),kept:maps.length,removed:original.__maps.length-maps.length});
          }
          console.log(JSON.stringify(results));
          NODE
      - name: Run regression suite
        run: node Cappe-in-MiamiRustWasm/tests/regression.cjs
      - name: Build and verify current ZIPs
        run: |
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          specs = [
              (Path('Cappe-in-MiamiWeb'), Path('Cappe-in-MiamiWeb/cappe-in-miamiWeb.zip')),
              (Path('Cappe-in-MiamiRustWasm'), Path('Cappe-in-MiamiRustWasm/cappe-in-miamiRustWasm-v293-preview.zip')),
          ]
          for folder, archive in specs:
              with ZipFile(archive, 'w', compression=ZIP_DEFLATED, compresslevel=9) as out:
                  for file in sorted(folder.rglob('*')):
                      if not file.is_file() or file == archive or file.suffix.lower() == '.zip':
                          continue
                      out.write(file, file.relative_to(folder).as_posix())
              with ZipFile(archive) as z:
                  assert z.testzip() is None
                  assert 'index.html' in z.namelist()
                  if 'RustWasm' in str(folder):
                      assert 'wasm-renderer/pkg/direct/direct_renderer_bg.wasm' in z.namelist()
              print(f'{archive}: {archive.stat().st_size} bytes')
          PY
      - name: Publish regenerated maps and ZIPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cappe-in-MiamiWeb/js/maps.js Cappe-in-MiamiRustWasm/js/maps.js Cappe-in-MiamiWeb/cappe-in-miamiWeb.zip Cappe-in-MiamiRustWasm/cappe-in-miamiRustWasm-v293-preview.zip
          git diff --cached --quiet && exit 0
          git commit -m "Trim inactive Neon map data and rebuild packages"
          git push origin main
