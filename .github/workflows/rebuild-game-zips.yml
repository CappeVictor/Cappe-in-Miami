name: Rebuild downloadable game packages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run regression suite
        run: node Cappe-in-MiamiRustWasm/tests/regression.cjs
      - name: Build and verify current ZIPs
        run: |
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          specs = [
              (Path('Cappe-in-MiamiWeb'), Path('Cappe-in-MiamiWeb/cappe-in-miamiWeb.zip')),
              (Path('Cappe-in-MiamiRustWasm'), Path('Cappe-in-MiamiRustWasm/cappe-in-miamiRustWasm-v293-preview.zip')),
          ]
          for folder, archive in specs:
              with ZipFile(archive, 'w', compression=ZIP_DEFLATED, compresslevel=9) as out:
                  for file in sorted(folder.rglob('*')):
                      if not file.is_file() or file == archive or file.suffix.lower() == '.zip':
                          continue
                      out.write(file, file.relative_to(folder).as_posix())
              with ZipFile(archive) as z:
                  assert z.testzip() is None
                  assert 'index.html' in z.namelist()
                  if 'RustWasm' in str(folder):
                      assert 'wasm-renderer/pkg/direct/direct_renderer_bg.wasm' in z.namelist()
              print(f'{archive}: {archive.stat().st_size} bytes')
          PY
      - name: Publish regenerated ZIPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cappe-in-MiamiWeb/cappe-in-miamiWeb.zip Cappe-in-MiamiRustWasm/cappe-in-miamiRustWasm-v293-preview.zip
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild downloadable game packages"
          git push origin main
