name: Gerar pacotes para teste

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar ZIPs separados e checksums
        shell: bash
        run: |
          mkdir -p dist
          for edition in Cappe-in-MiamiWeb Cappe-in-MiamiRustWasm; do
            (cd "$edition" && zip -qr "../dist/${edition}.zip" . -x '*.zip' '*/target/*' '*/node_modules/*' '.git/*')
          done
          cd dist
          sha256sum Cappe-in-MiamiWeb.zip Cappe-in-MiamiRustWasm.zip > SHA256SUMS.txt
          unzip -t Cappe-in-MiamiWeb.zip
          unzip -t Cappe-in-MiamiRustWasm.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar os pacotes extraidos
        shell: bash
        run: |
          mkdir -p /tmp/cappe-package-test/tests
          cp tests/server-smoke.cjs /tmp/cappe-package-test/tests/
          for edition in Cappe-in-MiamiWeb Cappe-in-MiamiRustWasm; do
            mkdir -p "/tmp/cappe-package-test/$edition"
            unzip -q "dist/$edition.zip" -d "/tmp/cappe-package-test/$edition"
          done
          node /tmp/cappe-package-test/tests/server-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Cappe-in-MiamiWeb
          path: dist/Cappe-in-MiamiWeb.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Cappe-in-MiamiRustWasm
          path: dist/Cappe-in-MiamiRustWasm.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Cappe-in-Miami-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
