name: Validate and publish optimized packages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'Cappe-in-MiamiWeb/README.md'
      - 'Cappe-in-MiamiWeb/server/server.js'
      - 'Cappe-in-MiamiWeb/index.html'
      - 'Cappe-in-MiamiWeb/sw.js'
      - 'Cappe-in-MiamiWeb/tests/**'
      - 'Cappe-in-MiamiRustWasm/README.md'
      - 'Cappe-in-MiamiRustWasm/server/server.js'
      - 'Cappe-in-MiamiRustWasm/index.html'
      - 'Cappe-in-MiamiRustWasm/sw.js'
      - 'Cappe-in-MiamiRustWasm/tests/**'
      - 'Cappe-in-MiamiRustWasm/wasm-renderer-direct/src/**'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Run source regression suites
        run: |
          node Cappe-in-MiamiRustWasm/tests/regression.cjs
          node Cappe-in-MiamiWeb/tests/compression-regression.cjs
          node Cappe-in-MiamiRustWasm/tests/compression-regression.cjs
      - name: Measure gameplay before rebuilding the Rust painter
        working-directory: Cappe-in-MiamiRustWasm
        run: |
          for run in 1 2 3; do
            CAPPE_PERF_ENEMIES=120 CAPPE_PERF_SPARKS=500 node tests/browser-performance.cjs > "$RUNNER_TEMP/sparks-before-$run.json"
          done
      - name: Build the optimized direct Rust/WASM painter
        working-directory: Cappe-in-MiamiRustWasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build --manifest-path wasm-renderer-direct/Cargo.toml --release --target wasm32-unknown-unknown
          wasm-bindgen wasm-renderer-direct/target/wasm32-unknown-unknown/release/cappe_renderer_direct.wasm --target web --out-dir wasm-renderer/pkg/direct --out-name direct_renderer
      - name: Verify Rust spark pixel parity in Chrome
        working-directory: Cappe-in-MiamiRustWasm
        run: |
          node tests/wasm-particle-input-parity.cjs
          node tests/regression.cjs
      - name: Measure gameplay after rebuilding the Rust painter
        working-directory: Cappe-in-MiamiRustWasm
        run: |
          for run in 1 2 3; do
            CAPPE_PERF_ENEMIES=120 CAPPE_PERF_SPARKS=500 node tests/browser-performance.cjs > "$RUNNER_TEMP/sparks-after-$run.json"
          done
      - name: Compare gameplay samples
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const base = process.env.RUNNER_TEMP;
          const median = values => values.sort((a,b)=>a-b)[Math.floor(values.length/2)];
          for (const build of ['Web', 'Rust/WASM']) {
            const samples = phase => [1,2,3].map(run => {
              const report = JSON.parse(fs.readFileSync(path.join(base, `sparks-${phase}-${run}.json`), 'utf8'));
              return report.results.find(result=>result.build===build).beforeAdaptation.work.p90Ms;
            });
            const before = samples('before'), after = samples('after');
            console.log(`${build} stress spark p90 mediano: ${median(before)} ms -> ${median(after)} ms; amostras antes=${before.join(',')} depois=${after.join(',')}`);
          }
          NODE
      - name: Build and validate current ZIP packages
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          packages = [
              (Path('Cappe-in-MiamiWeb'), 'cappe-in-miamiWeb.zip'),
              (Path('Cappe-in-MiamiRustWasm'), 'cappe-in-miamiRustWasm-v296-preview.zip'),
          ]
          for root, name in packages:
              target = root / name
              with ZipFile(target, 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
                  for item in sorted(root.rglob('*')):
                      if item.is_file() and item.suffix.lower() != '.zip' and '.git' not in item.parts:
                          archive.write(item, item.relative_to(root).as_posix())
              with ZipFile(target) as archive:
                  assert archive.testzip() is None, f'CRC inválido: {target}'
                  names = archive.namelist()
                  assert 'server/server.js' in names and 'js/maps.js' in names
                  assert 'tests/compression-regression.cjs' in names
              print(f'ZIP validado: {target} ({target.stat().st_size} bytes)')
          obsolete = Path('Cappe-in-MiamiRustWasm/cappe-in-miamiRustWasm-v295-preview.zip')
          obsolete.unlink(missing_ok=True)
          PY
      - name: Commit latest packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cappe-in-MiamiWeb/cappe-in-miamiWeb.zip Cappe-in-MiamiRustWasm/cappe-in-miamiRustWasm-v296-preview.zip
          git add -u Cappe-in-MiamiRustWasm
          if git diff --cached --quiet; then
            echo 'Os pacotes já estão atualizados.'
          else
            git commit -m 'Publish optimized Web v84 and Rust WASM v296 packages'
            git push
          fi
